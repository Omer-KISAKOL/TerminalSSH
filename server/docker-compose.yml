services:
  postgres:
    image: postgres:16-alpine
    container_name: terminalssh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: terminalssh
      POSTGRES_PASSWORD: terminalssh
      POSTGRES_DB: terminalssh
    ports:
      - '5432:5432'
    volumes:
      - terminalssh_pg_data:/var/lib/postgresql/data

volumes:
  terminalssh_pg_data:
